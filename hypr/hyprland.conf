# MONITORS 
monitor = ,preferred,auto,1
monitor = eDP-1, 1920x1080, 0x0, 1
monitor = HDMI-A-1, 1920x1080, 240x-900, 1 

# VARIABLES 
$scripts = ~/.config/hypr/scripts
$terminal = ghostty
$fileManager = nautilus
$menu = fuzzel
$browser = zen-browser

# Sourcing
# Keybinds
source = ~/.config/hypr/keybinds.conf
source = ~/.cache/wal/colors-hyprland.conf

# AUTOSTART
# Autostart Status Bar (HyprPanel)
exec-once = ags
exec-once = swww-daemon
exec-once = pypr
exec-once = swayosd-server
exec-once = dunst

# ENVIRONMENT VARIABLES
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# LOOK AND FEEL
# General
general {
    # Gaps
    gaps_in = 5
    gaps_out = 24

    # Border
    border_size = 2
    # Border colors
    col.active_border = $color13 $color12 $color14 90deg # Gradient
    col.active_border = $color13
    # col.active_border = rgba(ffffffff)
    # col.inactive_border = rgba(00000000)

    # Functionality
    resize_on_border = true
    no_focus_fallback = true
    layout = dwindle
    allow_tearing = false
}

# Decorations
decoration {
    rounding = 12

    blur {
      enabled = true
      xray = false
      new_optimizations = on
      popups = true
      size = 1
      passes = 4
      brightness = 1
      noise = 0.01
      contrast = 1
    }

    shadow {
      enabled = true
      range = 80
      render_power = 2
      ignore_window = false
      color = rgba(0, 0, 0, 0.95)
      offset = 0, 20
      scale = 0.95
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint, 0.22, 1, 0.36, 1

    animation = windows, 1, 3, easeOutQuint
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 4, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, easeOutQuint
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    smart_split = false
    smart_resizing = false
    pseudotile = yes
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############
# Keyboard
input {
    kb_layout = es,us
    kb_variant = 
    kb_model =
    kb_options = grp:lctrl_lshift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = -0.3
    touchpad {
        natural_scroll = yes
        clickfinger_behavior = true
        scroll_factor = 0.25
    }

}

gestures {
    workspace_swipe = true
    workspace_swipe_distance = 1000
    workspace_swipe_fingers = 4
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_create_new = true
}

# Laptop multimedia keys for volume and LCD brightness
# Generic
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# SwayOSD
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, exec swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindel = ,Caps_Lock, exec, swayosd-client --caps-lock

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# windowrulev2 = noborder, focus:0

$scratchpad = class:^(scratchpad)$
windowrulev2 = float,$scratchpad
windowrulev2 = workspace special silent,$scratchpad
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

windowrulev2 = float,class:(.*)(Nautilus)$
windowrulev2 = size 60% 70%,class:(.*)(Nautilus)$

windowrulev2 = float,class:(.*)(Calculator)$
windowrulev2 = size 25% 60%,class:(.*)(Calculator)$

windowrulev2 = float,title:Telegram
windowrulev2 = size 70% 80%,title:Telegram

windowrulev2 = float,title:Meeting chat

windowrulev2 = float,title:Picture-in-Picture

windowrulev2 = opacity 0.99,class:zen

# AGS
layerrule = blur, Bar*
layerrule = blur, Notifications*
layerrule = blur, QuickSettings*
layerrule = ignorezero, Bar*
layerrule = ignorezero, Notifications*
layerrule = ignorezero, QuickSettings*
